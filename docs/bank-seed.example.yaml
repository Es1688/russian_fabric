# Пример seed-файла для наполнения банка контента (scripts/bank_import.py).
#
# Формат: список items; обязательны только type и text, остальное опционально.
#   type       — тип записи (типы активных рубрик: postcard, phrase, event,
#                fact, recipe, advice, question, thought);
#   text       — текст записи; для bank-рубрик это тело поста, для
#                generative-рубрик (topic_day, good_night) — заготовка/тема,
#                которую LLM только оформляет;
#   months     — сезонность, числа 1..12; без ключа — круглый год;
#   event_date — «MM-DD» для фактов «в этот день» (тип event);
#   metadata   — для открыток: {image: имя_файла} относительно каталога
#                postcards (на VPS: /opt/maxnewsbot/data/postcards/).
#
# ВАЖНО по длинам (валидаторы рубрик, rubrics.yaml):
#   phrase  — 200..1000 символов (good_morning);
#   recipe / advice / question / fact для second_post — 200..1200;
#   thought — 200..1200 (good_night); классика и цитаты — только с авторством.
# Импорт: см. README «Наполнение банка контента».
items:
  - type: phrase
    text: >-
      Доброе утро! За окном раннее утро северо-запада — где-то туман, где-то
      первый свет на крышах. Налейте чай покрепче, откройте окно на пару
      минут и вспомните: самый длинный путь начинается с маленького шага,
      а самый добрый день — с доброго слова себе. Пусть сегодняшнее утро
      будет тёплым, а день — спокойным и хорошим.

  - type: phrase
    text: >-
      Доброе утро! Говорят, утро задаёт тон всему дню, поэтому не спешите
      вскакивать — потянитесь, улыбнитесь новому дню и подумайте о чём-то
      приятном. Кстати, учёные подтверждают: две минуты тишины с чашкой чая
      утром лучше бодрят, чем спешка. Хорошего вам дня и добрых новостей!

  - type: thought
    text: >-
      Спокойной ночи. День закончился, и всё, что в нём было — важное или
      мелкое, радостное или трудное — уже позади. Завтра он начнётся снова,
      и в нём обязательно найдётся что-то хорошее. Закрывайте глаза с
      лёгкой мыслью: вы хорошо поработали, вы заслужили отдых. Тихих снов
      и приятных сновидений.

  - type: fact
    text: >-
      Факт для темы дня: в Ленинградской области больше рек, чем в любой
      другой области Европейской части России — свыше 1800, а общая их
      длина превышает 40 тысяч километров. Самая длинная река области —
      Луга (353 км), она впадает в Финский залив.

  - type: advice
    text: >-
      Совет дня: чтобы окна дольше оставались чистыми осенью, протрите их
      раствором с добавлением пары ложек глицерина — дождевые капли будут
      скатываться, не оставляя разводов. А тряпку из микрофибры достаточно
      просто сполоснуть, моющее средство почти не нужно.

  - type: recipe
    text: >-
      Рецепт дня: яблочная шарлотка по-домашнему. Три яйца взбейте со
      стаканом сахара, вмешайте стакан муки и щепотку корицы. Яблоки —
      лучше антоновка — нарежьте дольками в форму, залейте тестом и
      выпекайте 35–40 минут при 180 °C до румяной корочки. Подавайте
      тёплой, с чашкой чая.

  - type: question
    text: >-
      Вопрос дня для неторопливого разговора: какое блюдо из детства вы
      помните лучше всего — и кто его готовил? Мамины пирожки, бабушкин
      холодец, школьные пончики? Запах и вкус хранят память лучше любых
      записей. Расскажите близким за вечерним чаем — и спросите их о том же.

  - type: event
    event_date: "06-12"
    text: >-
      В этот день, 12 июня, отмечается День России — праздник страны, её
      истории и людей. Хорошая тема, чтобы вспомнить места, где вы бывали:
      от Балтики до Байкала, и поделиться любимыми маршрутами с близкими.

  # Открытки требуют файла изображения в каталоге postcards (VPS:
