# Шаблон для VPS: подстановки __BOT_IMAGE__ и __APP_DIR__ (см. .github/workflows/docker.yml).

services:
  maxnewsbot:
    image: __BOT_IMAGE__
    container_name: maxnewsbot
    restart: unless-stopped
    env_file:
      - __APP_DIR__/.env
    environment:
      DATABASE_PATH: /app/data/max_news_bot.db
    volumes:
      - __APP_DIR__/data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/max_news_bot/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Host network: the socks5h egress proxy for foreign APIs (ADR-005)
    # listens on the host loopback only, which a bridge network cannot
    # reach; trade-offs are recorded in ARCHITECTURE.md ADR-005.
    network_mode: host
